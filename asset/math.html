<script>
// Left-align display equations on phones only (centered elsewhere); tags
// (equation numbers) stay on the right. MathJax reads this once at startup,
// so the choice is fixed at page load. Must be set before MathJax's deferred
// script runs. Breakpoint matches the mobile rules in asset/style.css.
window.MathJax = {
  output: {
    displayAlign: matchMedia("(max-width: 479.98px)").matches ? "left" : "center",
    displayIndent: "0"
  }
};
</script>
<script src="/asset/math.js"></script>
